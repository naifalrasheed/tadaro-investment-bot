version: 1.0
runtime: python311
build:
  commands:
    build:
      - echo "Installing Python dependencies for GitHub source deployment"
      - pip3 install --upgrade pip
      - pip3 install -r requirements.txt
      - echo "Build completed successfully"
run:
  runtime-version: "3.11"
  command: python3 -m gunicorn app:app --bind 0.0.0.0:8000 --workers 2 --timeout 300 --worker-class sync --log-level info --access-logfile - --error-logfile -
  network:
    port: 8000
    env: PORT
  env:
    # Application Configuration - Basic values only for GitHub source deployment
    - name: FLASK_APP
      value: app.py
    - name: ENVIRONMENT
      value: "production"
    - name: FLASK_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "INFO"
    - name: PYTHONPATH
      value: "/opt/render/project/src"
    - name: PORT
      value: "8000"